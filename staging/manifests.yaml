apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  annotations:
    idp.platform/logical-secret: database
    k8s.score.dev/resource-guid: 03efac18-a87d-4686-e12d-b2ab6d493f06
    k8s.score.dev/resource-uid: postgres.application#backend.db
    k8s.score.dev/source-workload: backend
  labels:
    app.kubernetes.io/name: pg-backend-03efac18
    app.kubernetes.io/part-of: idp-platform
  name: pg-backend-03efac18-cred
spec:
  destination:
    create: true
    name: pg-backend-03efac18-cred
    transformation:
      excludeRaw: true
      includes:
      - ^username$
      - ^password$
    type: kubernetes.io/basic-auth
  hmacSecretData: true
  mount: kv
  path: apps/student-manager/staging/database
  refreshAfter: 5m
  type: kv-v2
  vaultAuthRef: app-vault
