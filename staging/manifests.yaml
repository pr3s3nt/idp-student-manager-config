apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    k8s.score.dev/resource-guid: 03efac18-a87d-4686-e12d-b2ab6d493f06
    k8s.score.dev/resource-uid: postgres.application#backend.db
    k8s.score.dev/source-workload: backend
  labels:
    app.kubernetes.io/name: pg-backend-03efac18
    app.kubernetes.io/part-of: idp-platform
  name: pg-backend-03efac18
spec:
  bootstrap:
    initdb:
      database: app_backend
      owner: app_backend
      secret:
        name: pg-backend-03efac18-cred
  enableSuperuserAccess: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  instances: 1
  managed:
    roles:
    - ensure: present
      login: true
      name: app_backend
      passwordSecret:
        name: pg-backend-03efac18-cred
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  storage:
    size: 10Gi
    storageClass: storage-class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    k8s.score.dev/workload-name: backend
  labels:
    app.kubernetes.io/instance: backend-a090ec5608
    app.kubernetes.io/name: backend
    env: staging
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-a090ec5608
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        k8s.score.dev/workload-name: backend
        tags: python,fastapi,api
      labels:
        app.kubernetes.io/instance: backend-a090ec5608
        app.kubernetes.io/managed-by: score-k8s
        app.kubernetes.io/name: backend
    spec:
      containers:
      - env:
        - name: DB_HOST
          value: pg-backend-03efac18-rw
        - name: DB_NAME
          value: app_backend
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: pg-backend-03efac18-cred
        - name: DB_PORT
          value: '5432'
        - name: DB_USER
          value: app_backend
        image: localhost:5001/student-manager-backend:d7a632d7f706e6ffec06127064995aae4c0dc2ec
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
        name: backend
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      imagePullSecrets:
      - name: registry-pull
status: {}
---
